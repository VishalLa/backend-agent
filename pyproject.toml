[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "backend-agent"
version = "0.1.0"
description = "Local backend coding agent with LangGraph orchestration and tool execution"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "duckduckgo-search>=6.0",
    "httpx>=0.27",
    "ipykernel>=6.0",
    "jupyter-client>=8.0",
    "langchain-community>=0.2",
    "langchain-core>=0.3",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.4.1",
    "langgraph>=0.2.60",
    "pathspec>=0.12",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "rich>=15.0.0",
]

[project.scripts]
backend-agent = "main:main"
coding-agent = "main:main"

[tool.setuptools]
py-modules = ["main"]
packages = ["agent", "tools"]
